<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="香港交通實時看板">
  <title>香港實時到站看板 (極簡版)</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans HK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans HK"', 'system-ui', 'sans-serif'],
          },
          colors: {
            canvas: '#F4F6F9',
            brand: {
              orange: '#FF5722',
              orangeHover: '#F44336',
              dark: '#111827',
              gray: '#8C95A6',
              card: '#FFFFFF',
              lightPill: '#EBEFF5',
              mtr: '#A22030',
              kmb: '#E60012',
              nlb: '#00838F',
              ctb: '#D97706'
            }
          },
          boxShadow: {
            'soft': '0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 12px -2px rgba(0, 0, 0, 0.02)',
            'btn': '0 12px 24px -4px rgba(255, 87, 34, 0.35)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    
    /* Sticky Frosted Header */
    .safe-top-sticky {
      position: sticky;
      top: 0;
      z-index: 35;
      padding-top: max(14px, env(safe-area-inset-top, 0px));
      background: rgba(244, 246, 249, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes pawPulse {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.25) rotate(-12deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .animate-paw {
      animation: pawPulse 0.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
</head>
<body class="bg-canvas text-brand-dark font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Sticky Top Bar (Integrated Brand & Live Update Timestamp) -->
  <header class="safe-top-sticky w-full border-b border-gray-200/40 transition-all">
    <div class="max-w-md mx-auto px-5 py-2.5 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-2xl bg-brand-dark text-white flex items-center justify-center font-extrabold text-xs shadow-sm shrink-0">
          HK
        </div>
        <div class="flex flex-col">
          <span class="text-[10px] font-extrabold tracking-wider text-brand-gray uppercase leading-none">LIVE TRANSIT BOARD</span>
          <span id="lastGlobalUpdated" class="text-[11px] font-bold text-brand-dark/70 leading-tight mt-0.5">正在同步實時班次...</span>
        </div>
      </div>

      <!-- Top Action Buttons: Bookmarks & Add Route -->
      <div class="flex items-center space-x-1.5 shrink-0">
        <button onclick="toggleBookmarksModal(true)" class="px-3 py-1.5 rounded-full bg-white shadow-soft flex items-center gap-1 text-xs font-bold text-brand-dark active:scale-95 transition border border-gray-100" title="我的收藏">
          <span class="text-amber-500">⭐</span>
          <span>收藏</span>
        </button>
        <button onclick="toggleSearchModal(true)" class="px-3 py-1.5 rounded-full bg-white shadow-soft flex items-center gap-1 text-xs font-bold text-brand-dark active:scale-95 transition border border-gray-100" title="搜尋並加入路線">
          <svg class="w-3.5 h-3.5 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
          <span>加路線</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Container (Direct Cards View) -->
  <main class="max-w-md mx-auto w-full px-5 pt-3 pb-32 flex-1 flex flex-col">
    
    <!-- Monitored Cards Container (Direct Flow) -->
    <div id="multiBusCardsContainer" class="space-y-3 flex-1">
      <!-- Dynamic Live Cards -->
    </div>

    <!-- Minimalist Dashed Add Prompt -->
    <button onclick="toggleSearchModal(true)" class="w-full mt-3 py-3.5 border-2 border-dashed border-gray-200 hover:border-brand-orange/50 rounded-3xl text-brand-gray hover:text-brand-orange text-xs font-extrabold flex items-center justify-center space-x-2 transition-all bg-white/40 active:scale-[0.99]">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
      </svg>
      <span>新增港鐵站、北大嶼山巴士或市區路線到看板</span>
    </button>

  </main>

  <!-- Bottom Floating Refresh Button with Cat Paw Icon (🐾) -->
  <div class="fixed bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-canvas via-canvas/90 to-transparent pointer-events-none flex justify-center z-40">
    <button onclick="refreshAllBusesETA()" id="refreshBtn" class="pointer-events-auto w-full max-w-md bg-brand-orange hover:bg-brand-orangeHover text-white font-bold py-4 px-6 rounded-2xl shadow-btn flex items-center justify-center space-x-2.5 active:scale-[0.98] transition-all">
      <svg id="refreshPawIcon" class="w-5 h-5 transition-transform duration-300 fill-current" viewBox="0 0 24 24">
        <path d="M12 11.5c-2.4 0-4.5 1.8-4.5 4.3 0 2.2 2 3.7 4.5 3.7s4.5-1.5 4.5-3.7c0-2.5-2.1-4.3-4.5-4.3z" />
        <circle cx="6.5" cy="10.5" r="1.8" />
        <circle cx="10" cy="7.2" r="1.8" />
        <circle cx="14" cy="7.2" r="1.8" />
        <circle cx="17.5" cy="10.5" r="1.8" />
      </svg>
      <span class="text-sm font-bold tracking-wide">即時全部重新整理</span>
    </button>
  </div>

  <!-- MODAL 1: Bookmarks Sheet (⭐ 我的收藏) -->
  <div id="bookmarksModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center transition-opacity duration-300">
    <div class="bg-white w-full max-w-md rounded-t-[32px] p-6 pb-10 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
      
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2">
          <span class="text-base">⭐</span>
          <h3 class="text-lg font-extrabold text-brand-dark">常用路線收藏庫</h3>
        </div>
        <div class="flex items-center space-x-3">
          <button onclick="resetToDefaultBuses()" class="text-[11px] text-brand-orange font-bold hover:underline">
            重設預設
          </button>
          <button onclick="toggleBookmarksModal(false)" class="text-xs text-brand-gray font-bold p-1">關閉</button>
        </div>
      </div>

      <div id="bookmarksListContainer" class="space-y-2 overflow-y-auto max-h-[60vh] hide-scrollbar p-0.5">
        <!-- Dynamically Injected Bookmarks -->
      </div>
    </div>
  </div>

  <!-- MODAL 2: Route Stops Explorer Sheet (路線各站一覽) -->
  <div id="stopsModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center transition-opacity duration-300">
    <div class="bg-white w-full max-w-md rounded-t-[32px] p-6 pb-10 shadow-2xl max-h-[88vh] flex flex-col">
      <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
      
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="text-base font-extrabold text-brand-dark" id="stopsModalTitle">路線站表</h3>
          <p class="text-xs text-brand-gray" id="stopsModalSubtitle">點擊車站即可加入看板</p>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="reverseDirectionInModal()" class="text-xs font-bold text-brand-orange flex items-center space-x-1 hover:opacity-80 transition bg-orange-50 px-2.5 py-1.5 rounded-xl">
            <span>⇄ 切換方向</span>
          </button>
          <button onclick="toggleStopsModal(false)" class="text-xs text-brand-gray font-bold p-1">關閉</button>
        </div>
      </div>

      <div id="stopsModalListContainer" class="space-y-1.5 overflow-y-auto max-h-[60vh] hide-scrollbar p-0.5">
        <!-- Dynamically Injected Stops -->
      </div>
    </div>
  </div>

  <!-- MODAL 3: Search Route Modal Sheet -->
  <div id="searchModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center transition-opacity duration-300">
    <div class="bg-white w-full max-w-md rounded-t-[32px] p-6 pb-10 shadow-2xl max-h-[90vh] flex flex-col">
      <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
      
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="text-lg font-extrabold text-brand-dark">加入監控路線</h3>
          <p class="text-xs text-brand-gray">支援 嶼巴 · 港鐵 · 九巴/龍運 · 城巴</p>
        </div>
        <button onclick="toggleSearchModal(false)" class="text-sm text-brand-gray font-bold p-1">關閉</button>
      </div>

      <!-- Company Filter Selector -->
      <div class="flex items-center space-x-1 mb-3 bg-canvas p-1 rounded-2xl overflow-x-auto hide-scrollbar">
        <button onclick="setSearchCompany('ALL')" id="filterAll" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-xl transition bg-white text-brand-dark shadow-sm shrink-0">
          全部
        </button>
        <button onclick="setSearchCompany('NLB')" id="filterNlb" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-xl transition text-brand-gray shrink-0">
          嶼巴 NLB
        </button>
        <button onclick="setSearchCompany('MTR')" id="filterMtr" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-xl transition text-brand-gray shrink-0">
          港鐵 MTR
        </button>
        <button onclick="setSearchCompany('KMB')" id="filterKmb" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-xl transition text-brand-gray shrink-0">
          九巴/龍運
        </button>
        <button onclick="setSearchCompany('CTB')" id="filterCtb" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-xl transition text-brand-gray shrink-0">
          城巴 CTB
        </button>
      </div>

      <!-- MTR Line Direct Selector -->
      <div id="mtrLinesQuickContainer" class="hidden mb-3">
        <div class="text-[11px] font-bold text-brand-gray mb-1.5">選擇港鐵綫路：</div>
        <div class="grid grid-cols-2 gap-1.5 max-h-40 overflow-y-auto hide-scrollbar p-0.5">
          <button onclick="selectMtrLine('TCL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-orange-50 text-[#E07A20] border border-orange-200 flex items-center justify-between hover:opacity-90">
            <span>東涌綫 TCL</span>
            <span class="text-[10px] opacity-70">香港 ⇄ 東涌</span>
          </button>
          <button onclick="selectMtrLine('TML')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-amber-50 text-[#923011] border border-amber-200 flex items-center justify-between hover:opacity-90">
            <span>屯馬綫 TML</span>
            <span class="text-[10px] opacity-70">屯門 ⇄ 烏溪沙</span>
          </button>
          <button onclick="selectMtrLine('AEL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-teal-50 text-[#00888A] border border-teal-200 flex items-center justify-between hover:opacity-90">
            <span>機場快綫 AEL</span>
            <span class="text-[10px] opacity-70">香港 ⇄ 博覽館</span>
          </button>
          <button onclick="selectMtrLine('EAL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-sky-50 text-[#007EA7] border border-sky-200 flex items-center justify-between hover:opacity-90">
            <span>東鐵綫 EAL</span>
            <span class="text-[10px] opacity-70">金鐘 ⇄ 羅湖/落馬洲</span>
          </button>
          <button onclick="selectMtrLine('TWL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-red-50 text-[#ED1D24] border border-red-200 flex items-center justify-between hover:opacity-90">
            <span>荃灣綫 TWL</span>
            <span class="text-[10px] opacity-70">中環 ⇄ 荃灣</span>
          </button>
          <button onclick="selectMtrLine('ISL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-blue-50 text-[#007DC5] border border-blue-200 flex items-center justify-between hover:opacity-90">
            <span>港島綫 ISL</span>
            <span class="text-[10px] opacity-70">堅尼地城 ⇄ 柴灣</span>
          </button>
          <button onclick="selectMtrLine('KTL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-emerald-50 text-[#00873E] border border-emerald-200 flex items-center justify-between hover:opacity-90">
            <span>觀塘綫 KTL</span>
            <span class="text-[10px] opacity-70">黃埔 ⇄ 調景嶺</span>
          </button>
          <button onclick="selectMtrLine('TKL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-purple-50 text-[#7D499D] border border-purple-200 flex items-center justify-between hover:opacity-90">
            <span>將軍澳綫 TKL</span>
            <span class="text-[10px] opacity-70">北角 ⇄ 寶琳/康城</span>
          </button>
          <button onclick="selectMtrLine('SIL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-lime-50 text-[#6B750A] border border-lime-200 flex items-center justify-between hover:opacity-90">
            <span>南港島綫 SIL</span>
            <span class="text-[10px] opacity-70">金鐘 ⇄ 海怡半島</span>
          </button>
          <button onclick="selectMtrLine('DRL')" class="p-2.5 rounded-xl text-left font-bold text-xs bg-pink-50 text-[#B84E85] border border-pink-200 flex items-center justify-between hover:opacity-90">
            <span>迪士尼綫 DRL</span>
            <span class="text-[10px] opacity-70">欣澳 ⇄ 迪士尼</span>
          </button>
        </div>
      </div>

      <!-- Search Input -->
      <div id="searchBoxContainer" class="relative mb-2">
        <input id="searchInput" type="text" placeholder="輸入路線 (如 37M, 38, B6, S1, E36, 968, 屯馬綫)..." 
               oninput="handleSearchInputDebounce()"
               class="w-full bg-canvas py-3.5 pl-11 pr-4 rounded-2xl text-sm font-bold text-brand-dark focus:outline-none focus:ring-2 focus:ring-brand-orange/40 uppercase">
        <svg class="w-5 h-5 text-brand-gray absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <!-- Search Suggestions -->
      <div id="searchSuggestionsContainer" class="hidden max-h-48 overflow-y-auto hide-scrollbar space-y-1.5 mb-2 p-1 bg-gray-50 rounded-2xl border border-gray-100">
      </div>

      <!-- Quick Chips -->
      <div id="quickChipsContainer" class="flex items-center space-x-1.5 overflow-x-auto hide-scrollbar mb-3 py-1">
        <span class="text-[11px] font-bold text-brand-gray shrink-0">熱門路線:</span>
        <button onclick="quickSearch('37M', 'NLB')" class="px-2.5 py-1 rounded-xl bg-teal-50 text-teal-700 text-xs font-bold shrink-0">37M (迎東/東涌)</button>
        <button onclick="quickSearch('38', 'NLB')" class="px-2.5 py-1 rounded-xl bg-teal-50 text-teal-700 text-xs font-bold shrink-0">38 (逸東/東涌)</button>
        <button onclick="quickSearch('B6', 'NLB')" class="px-2.5 py-1 rounded-xl bg-teal-50 text-teal-700 text-xs font-bold shrink-0">B6 (大橋香港口岸)</button>
        <button onclick="quickSearch('S1', 'CTB')" class="px-2.5 py-1 rounded-xl bg-amber-50 text-amber-700 text-xs font-bold shrink-0">S1 (東涌/機場)</button>
        <button onclick="quickSearch('E36', 'KMB')" class="px-2.5 py-1 rounded-xl bg-red-50 text-red-600 text-xs font-bold shrink-0">E36 (元朗/機場)</button>
        <button onclick="selectMtrLine('TCL')" class="px-2.5 py-1 rounded-xl bg-orange-50 text-[#E07A20] text-xs font-bold shrink-0">東涌綫</button>
        <button onclick="selectMtrLine('TML')" class="px-2.5 py-1 rounded-xl bg-amber-50 text-[#923011] text-xs font-bold shrink-0">屯馬綫</button>
        <button onclick="quickSearch('B1', 'KMB')" class="px-2.5 py-1 rounded-xl bg-red-50 text-red-600 text-xs font-bold shrink-0">B1 (形點/落馬洲)</button>
        <button onclick="quickSearch('968', 'KMB')" class="px-2.5 py-1 rounded-xl bg-red-50 text-red-600 text-xs font-bold shrink-0">968 (元朗/天后)</button>
      </div>

      <button onclick="handleSearchRouteSubmit()" class="w-full bg-brand-dark text-white font-bold py-3.5 rounded-2xl text-sm active:scale-[0.98] transition shadow-md">
        搜尋分站並加入看板
      </button>
    </div>
  </div>

  <script>
    // =========================================================================
    // Core Global State & Config (MTR + NLB + KMB/LWB + CTB)
    // =========================================================================

    // -------------------------------------------------------------------------
    // NLB API Connectors (with Cache-Buster & Expired ETA Filter)
    // -------------------------------------------------------------------------
    async function fetchNlbRoutes() {
      if (nlbRoutesCache && nlbRoutesCache.length > 0) return nlbRoutesCache;
      try {
        const endpoints = [
          'https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list',
          'https://rt.data.gov.hk/v1/transport/nlb/route.php?action=list'
        ];
        for (const url of endpoints) {
          try {
            const res = await fetch(url);
            if (res.ok) {
              const data = await res.json();
              if (data && data.routes && Array.isArray(data.routes) && data.routes.length > 0) {
                nlbRoutesCache = data.routes;
                return nlbRoutesCache;
              }
            }
          } catch (e) {
            console.warn("NLB Route endpoint error:", url, e);
          }
        }
      } catch (e) {
        console.warn("NLB Route Cache Error", e);
      }
      return [];
    }

    async function fetchNlbETA(routeId, stopId, routeNo = "") {
      if (!routeId && routeNo) {
        const routes = await fetchNlbRoutes();
        const matched = routes.find(r => r.routeNo.toUpperCase() === routeNo.toUpperCase());
        if (matched) routeId = matched.routeId;
      }
      if (!routeId || !stopId) return [];

      const now = Date.now();
      const cacheBuster = `_t=${now}`;
      const endpoints = [
        `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${stopId}&language=zh&${cacheBuster}`,
        `https://rt.data.gov.hk/v1/transport/nlb/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${stopId}&language=zh&${cacheBuster}`
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (data && data.estimatedArrivals && Array.isArray(data.estimatedArrivals) && data.estimatedArrivals.length > 0) {
              return data.estimatedArrivals
                .filter(item => {
                  if (!item) return false;
                  if (item.departed === 1) return false;
                  if (!item.estimatedArrivalTime) return true;
                  const safeTimeStr = item.estimatedArrivalTime.includes('T') ? item.estimatedArrivalTime : item.estimatedArrivalTime.replace(' ', 'T');
                  const etaTime = new Date(safeTimeStr).getTime();
                  // Drop passed buses older than 60s ago
                  return isNaN(etaTime) || (etaTime - now) >= -60000;
                })
                .map(item => {
                  const rawTime = item.estimatedArrivalTime || "";
                  const safeTimeStr = rawTime.includes('T') ? rawTime : rawTime.replace(' ', 'T');
                  const etaTime = new Date(safeTimeStr).getTime();
                  const diffMinutes = isNaN(etaTime) ? null : Math.max(0, Math.floor((etaTime - now) / 60000));
                  const exactTime = !isNaN(etaTime) 
                    ? formatTimeHM(new Date(safeTimeStr)) 
                    : (rawTime.length >= 16 ? rawTime.slice(11, 16) : '--:--');

                  return {
                    minutes: diffMinutes,
                    remark: item.routeVariantName || '',
                    dest: '',
                    exactTime: exactTime,
                    isScheduledOnly: diffMinutes === null
                  };
                });
            }
          }
        } catch (err) {
          console.warn("NLB ETA fallback error", err);
        }
      }
      return [];
    }

    // -------------------------------------------------------------------------
    // MTR ETA Engine (with Cache-Buster & Expired ETA Filter)
    // -------------------------------------------------------------------------
    async function fetchMtrETA(line, station, direction) {
      if (!line || !station) return [];
      try {
        const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${station}&lang=TC&_t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return [];
        const json = await res.json();

        if (!json || json.status === 0 || !json.data) return [];
        
        const key = `${line}-${station}`;
        const stationData = json.data[key];
        if (!stationData) return [];

        let trains = [];
        if (direction && stationData[direction]) {
          trains = stationData[direction];
        } else {
          const up = stationData.UP || [];
          const down = stationData.DOWN || [];
          trains = [...up, ...down];
        }

        const now = Date.now();

        return trains
          .filter(t => {
            if (!t || !t.time) return false;
            const safeTimeStr = t.time.replace(' ', 'T');
            const tTime = new Date(safeTimeStr).getTime();
            return isNaN(tTime) || (tTime - now) >= -60000;
          })
          .map(t => {
            const destName = MTR_STATION_NAMES[t.dest] || t.dest || '';
            let diffMinutes = null;
            if (t.ttnt !== undefined && t.ttnt !== null && t.ttnt !== '-' && !isNaN(parseInt(t.ttnt))) {
              diffMinutes = Math.max(0, parseInt(t.ttnt));
            } else {
              const safeTimeStr = t.time.replace(' ', 'T');
              const tTime = new Date(safeTimeStr).getTime();
              if (!isNaN(tTime)) {
                diffMinutes = Math.max(0, Math.floor((tTime - now) / 60000));
              }
            }

            const safeTimeStr = t.time.replace(' ', 'T');
            const tDate = new Date(safeTimeStr);
            const exactTime = !isNaN(tDate.getTime()) 
              ? formatTimeHM(tDate) 
              : (t.time.length >= 16 ? t.time.slice(11, 16) : '--:--');

            const platText = t.plat ? `${t.plat}號月台` : '';
            const remark = platText ? `${platText} · 往 ${destName}` : `往 ${destName}`;

            return {
              minutes: diffMinutes,
              remark: remark,
              dest: destName,
              platform: t.plat || '',
              exactTime: exactTime,
              isScheduledOnly: false
            };
          })
          .sort((a, b) => (a.minutes ?? 999) - (b.minutes ?? 999));
      } catch (e) {
        console.warn("MTR ETA fetch error", e);
        return [];
      }
    }

    // -------------------------------------------------------------------------
    // KMB / LWB ETA Engine (with Cache-Buster & Expired Past Bus Filter)
    // -------------------------------------------------------------------------
    async function fetchKmbETA(stopId, route, serviceType = "1") {
      const now = Date.now();
      const cacheBuster = `_t=${now}`;
      let rawEtas = [];

      try {
        const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/${serviceType || '1'}?${cacheBuster}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.data && data.data.length > 0) {
            rawEtas = data.data;
          }
        }
      } catch (err) {
        console.warn("KMB Tier 1 fetch error", err);
      }

      if (rawEtas.length === 0 && stopId) {
        try {
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}?${cacheBuster}`;
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (data && data.data && data.data.length > 0) {
              rawEtas = data.data.filter(item => item.route && item.route.toUpperCase() === route.toUpperCase());
            }
          }
        } catch (err) {
          console.warn("KMB Tier 2 fallback error", err);
        }
      }

      if (rawEtas.length === 0) {
        try {
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/${serviceType || '1'}?${cacheBuster}`;
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (data && data.data && data.data.length > 0) {
              rawEtas = data.data.filter(item => String(item.stop) === String(stopId));
            }
          }
        } catch (err) {
          console.warn("KMB Tier 3 fallback error", err);
        }
      }

      if (!rawEtas || rawEtas.length === 0) return [];

      return rawEtas
        .filter(item => {
          if (!item.eta) return true; // keep scheduled-only
          const etaTime = new Date(item.eta).getTime();
          if (isNaN(etaTime)) return false;
          // Drop buses that already passed over 60s ago
          return (etaTime - now) >= -60000;
        })
        .map(item => {
          if (!item.eta) {
            return {
              minutes: null,
              remark: item.rmk_tc || '原定班次',
              dest: item.dest_tc || '',
              exactTime: '--:--',
              isScheduledOnly: true
            };
          }

          const etaDate = new Date(item.eta);
          const etaTimestamp = etaDate.getTime();
          const diffMs = etaTimestamp - now;
          const diffMinutes = Math.max(0, Math.floor(diffMs / 60000));
          const exactTime = formatTimeHM(etaDate);

          return {
            minutes: diffMinutes,
            remark: item.rmk_tc || '',
            dest: item.dest_tc || '',
            exactTime: exactTime,
            isScheduledOnly: false
          };
        })
        .sort((a, b) => (a.minutes ?? 999) - (b.minutes ?? 999));
    }

    // CTB API Connectors (with Cache-Buster & Expired ETA Filter)

    async function fetchCtbRoutes() {
      if (ctbRoutesCache && ctbRoutesCache.length > 0) return ctbRoutesCache;
      try {
        const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/CTB');
        if (res.ok) {
          const json = await res.json();
          if (json && json.data) {
            ctbRoutesCache = json.data;
            return ctbRoutesCache;
          }
        }
      } catch (e) {

    async function fetchCtbETA(stopId, route) {
      try {
        const url = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}?_t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return [];
        const data = await res.json();
        const now = Date.now();

        return (data.data || [])
          .filter(item => {
            if (!item || !item.eta) return false;
            const etaTime = new Date(item.eta).getTime();
            return isNaN(etaTime) || (etaTime - now) >= -60000;
          })
          .map(item => {
            const etaDate = new Date(item.eta);
            const etaTime = etaDate.getTime();
            const diffMinutes = isNaN(etaTime) ? null : Math.max(0, Math.floor((etaTime - now) / 60000));
            return {
              minutes: diffMinutes,
              remark: item.rmk_tc || '',
              dest: item.dest_tc || '',
              exactTime: !isNaN(etaTime) ? formatTimeHM(etaDate) : '--:--',
              isScheduledOnly: diffMinutes === null
            };
          })
          .sort((a, b) => (a.minutes ?? 999) - (b.minutes ?? 999));
      } catch (e) {
        console.warn("CTB ETA Error", e);
        return [];
      }
    }

    // Master Dispatcher
    async function getBusETAForItem(item) {
      if (item.company === 'NLB') {
        return await fetchNlbETA(item.routeId, item.stopId, item.route);
      } else if (item.company === 'MTR') {
        return await fetchMtrETA(item.line || item.route, item.stopId, item.direction);
      } else if (item.company === 'CTB') {
        return await fetchCtbETA(item.stopId, item.route);
      } else {
        return await fetchKmbETA(item.stopId, item.route, item.serviceType || '1');
      }
    }

      const isMtr = bus.company === 'MTR';
      return bookmarks.some(b => 
        b.company === bus.company && 
        b.route === bus.route && 
        String(b.stopId) === String(bus.stopId) && 
        (!isMtr || b.direction === bus.direction)
      );
    }

    function toggleBookmarkForBus(index) {
      const bus = monitoredBuses[index];
      if (!bus) return;

      const isMtr = bus.company === 'MTR';
      const existingIndex = bookmarks.findIndex(b => 
        b.company === bus.company && 
        b.route === bus.route && 
        String(b.stopId) === String(bus.stopId) && 
        (!isMtr || b.direction === bus.direction)
      );

      if (existingIndex >= 0) {
        bookmarks.splice(existingIndex, 1);
        localStorage.setItem('hk_bookmarks_ultramin_v2', JSON.stringify(bookmarks));

              <!-- Main ETA Counter Highlight -->

                ${hasData ? `
                  ${hasValidMin ? `
                    <div class="text-3xl font-extrabold tracking-tighter ${isUrgent ? (isMtr ? 'text-brand-mtr animate-pulse' : 'text-brand-orange animate-pulse') : 'text-brand-dark'}">
                      ${isArriving ? '即將' : nextBus.minutes}
                      <span class="text-xs font-bold uppercase tracking-normal ${isUrgent ? (isMtr ? 'text-brand-mtr' : 'text-brand-orange') : 'text-brand-gray'}">${isArriving ? '抵達' : '分鐘'}</span>
                    </div>
                    <div class="text-[11px] font-semibold text-brand-gray">預計 ${nextBus.exactTime} ${nextBus.remark ? `<span class="${isMtr ? 'text-brand-mtr' : (isNlb ? 'text-brand-nlb' : 'text-brand-orange')}">(${nextBus.remark})</span>` : ''}</div>
                  ` : `
                    <div class="text-base font-extrabold ${isMtr ? 'text-brand-mtr' : (isNlb ? 'text-brand-nlb' : 'text-brand-orange')}">${nextBus.remark || '原定班次'}</div>
                    <div class="text-[10px] text-brand-gray">預計 ${nextBus.exactTime || '--:--'}</div>
                  `}
                ` : `
                  <div class="text-sm font-extrabold text-brand-gray">未有班次</div>
                  <div class="text-[10px] text-gray-400">非營運時段或無即時資料</div>
                `}
              </div>
            </div>

            <!-- Subsequent 2nd Bus/Train Sub-bar -->
            ${subsequentBus ? `
              <div class="pt-2.5 mt-2 border-t border-gray-100 flex items-center justify-between text-xs">
                <span class="text-brand-gray font-medium flex items-center gap-1.5 flex-wrap">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span>下班車: <strong class="text-brand-dark font-bold">${subsequentBus.exactTime}</strong></span>
                  ${subsequentBus.remark ? `<span class="text-[10px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded font-bold">${subsequentBus.remark}</span>` : ''}
                </span>
                <span class="font-extrabold text-brand-dark">
                  ${subsequentBus.minutes !== null ? (subsequentBus.minutes <= 0 ? '即將到' : subsequentBus.minutes + ' 分鐘後') : (subsequentBus.remark || '')}
                </span>
              </div>
            ` : ''}

            <!-- 3rd Bus/Train Sub-bar -->
            ${thirdBus ? `
              <div class="pt-1.5 mt-1 flex items-center justify-between text-[11px]">
                <span class="text-gray-400 font-medium flex items-center gap-1.5">
                  <span class="w-1 h-1 rounded-full bg-gray-300"></span>
                  <span>第 3 班: <strong class="text-gray-600 font-semibold">${thirdBus.exactTime}</strong></span>
                  ${thirdBus.remark ? `<span class="text-[9px] bg-gray-100 text-gray-500 px-1 rounded">${thirdBus.remark}</span>` : ''}
                </span>
                <span class="font-semibold text-gray-500">
                  ${thirdBus.minutes !== null ? (thirdBus.minutes <= 0 ? '即將到' : thirdBus.minutes + ' 分鐘後') : ''}

      container.innerHTML = html;
    }

    function removeMonitoredBus(index) {
      const removed = monitoredBuses.splice(index, 1);
      saveMonitoredBuses();
      refreshAllBusesETA();
      showToast(`已從看板移除 ${removed[0]?.route || ''}`);
    }

    // Inspect Route inside Stops Explorer Modal
    function inspectRouteInExplorer(index) {
      const item = monitoredBuses[index];
      if (!item) return;

      if (item.company === 'MTR') {
        const lineCode = item.line || item.route;
        const lineConfig = MTR_LINES[lineCode] || MTR_LINES.TML;
        explorerRoute = {
          company: 'MTR',
          line: lineConfig.code,
          route: lineConfig.name,
          direction: item.direction || 'UP',
          serviceType: '',
          routeId: '',
          dest: item.dest || (item.direction === 'DOWN' ? lineConfig.downDest : lineConfig.upDest),
          selectedStopId: item.stopId
        };
      } else if (item.company === 'NLB') {
        explorerRoute = {
          company: 'NLB',
          line: '',
          route: item.route,
          direction: item.direction || 'outbound',
          serviceType: item.serviceType || '1',
          routeId: item.routeId || '',
          dest: item.dest || '終點站',
          selectedStopId: item.stopId
        };
      } else {
        explorerRoute = {
          company: item.company || 'KMB',
          line: '',
          route: item.route,
          direction: item.direction || 'outbound',
          serviceType: item.serviceType || '1',
          routeId: item.routeId || '',
          dest: item.dest,
          selectedStopId: item.stopId
        };
      }

      toggleStopsModal(true);
    }

    // Add Stop to Monitored Board
    function addStopToMonitoredBoard(stopId, stopName) {
      if (explorerRoute.company === 'MTR') {
        const lineCode = explorerRoute.line;
        const exists = monitoredBuses.some(b => 
          b.company === 'MTR' && 
          b.line === lineCode && 
          b.stopId === stopId &&
          b.direction === explorerRoute.direction
        );

        if (exists) {
          showToast("此港鐵站已在看板中！");
          return;
        }

        monitoredBuses.push({
          id: `mtr-${lineCode}-${stopId}-${explorerRoute.direction}-${Date.now()}`,
          company: 'MTR',
          line: lineCode,
          route: explorerRoute.route,
          direction: explorerRoute.direction,
          serviceType: '',
          stopId: stopId,
          stopName: `${stopName}站`,
          dest: explorerRoute.dest,
          routeId: ''
        });

        saveMonitoredBuses();
        showToast(`已加入「港鐵 ${explorerRoute.route} - ${stopName}站」至看板！`);
        toggleStopsModal(false);
        refreshAllBusesETA();
        return;
      }

      const exists = monitoredBuses.some(b => 
        b.company === explorerRoute.company && 
        b.route === explorerRoute.route && 
        String(b.stopId) === String(stopId)
      );

      if (exists) {
        showToast("此車站已在看板中！");
        return;
      }

      monitoredBuses.push({
        id: `${explorerRoute.company}-${explorerRoute.route}-${stopId}-${Date.now()}`,
        company: explorerRoute.company,
        line: '',
        route: explorerRoute.route,
        direction: explorerRoute.direction || 'outbound',
        serviceType: explorerRoute.serviceType || '1',
        stopId: stopId,
        stopName: stopName,
        dest: explorerRoute.dest,
        routeId: explorerRoute.routeId || ''
      });

      saveMonitoredBuses();
      showToast(`已加入「${explorerRoute.route} - ${stopName}」至看板！`);
      toggleStopsModal(false);
      refreshAllBusesETA();
    }

    // Stop Names Cache Fetchers
    async function getKmbStopName(stopId) {
      if (kmbStopNameCache.has(stopId)) return kmbStopNameCache.get(stopId);
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`);
        const data = await res.json();
        const name = (data && data.data && data.data.name_tc) ? data.data.name_tc : '分站';
        kmbStopNameCache.set(stopId, name);
        return name;
      } catch (e) {
        return '分站';
      }
    }

    async function getCtbStopName(stopId) {
      if (ctbStopNameCache.has(stopId)) return ctbStopNameCache.get(stopId);
      try {
        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${stopId}`);
        const data = await res.json();
        const name = (data && data.data && data.data.name_tc) ? data.data.name_tc : '分站';
        ctbStopNameCache.set(stopId, name);
        return name;
      } catch (e) {
        return '分站';
      }
    }

    // Render Route Stops Explorer inside Modal
    async function renderStopsExplorerModal() {
      const container = document.getElementById('stopsModalListContainer');
      const isMtr = explorerRoute.company === 'MTR';
      const mtrLineInfo = isMtr ? (MTR_LINES[explorerRoute.line] || MTR_LINES[explorerRoute.route]) : null;
      const comp = COMPANY_CONFIG[explorerRoute.company] || COMPANY_CONFIG.KMB;
      
      const routeName = isMtr ? (mtrLineInfo ? mtrLineInfo.name : explorerRoute.route) : explorerRoute.route;
      document.getElementById('stopsModalTitle').innerText = `${comp.name} · ${routeName}`;
      document.getElementById('stopsModalSubtitle').innerText = `往 ${explorerRoute.dest || '終點站'} - 點選車站加入看板`;
      
      container.innerHTML = `<div class="text-xs text-brand-gray p-6 text-center animate-pulse">正在載入 ${routeName} 站表...</div>`;

      try {
        if (explorerRoute.company === 'NLB') {
          if (!explorerRoute.routeId) {
            const routes = await fetchNlbRoutes();
            const matched = routes.find(r => r.routeNo.toUpperCase() === explorerRoute.route.toUpperCase());
            if (matched) {
              explorerRoute.routeId = matched.routeId;
              if (matched.routeName_c && matched.routeName_c.includes('>')) {
                const parts = matched.routeName_c.split('>');
                explorerRoute.dest = parts.length > 1 ? parts[1].trim() : parts[0].trim();
              } else {
                explorerRoute.dest = matched.routeName_c || '大嶼山';
              }
              document.getElementById('stopsModalSubtitle').innerText = `往 ${explorerRoute.dest} - 點選車站加入看板`;
            }
          }

          if (!explorerRoute.routeId) {
            container.innerHTML = `<div class="text-xs text-brand-gray p-4 text-center">找不到此嶼巴路線，請確認路線號碼</div>`;
            return;
          }

          const endpoints = [
            `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${explorerRoute.routeId}`,
            `https://rt.data.gov.hk/v1/transport/nlb/stop.php?action=list&routeId=${explorerRoute.routeId}`
          ];

          let data = null;
          for (const url of endpoints) {
            try {
              const res = await fetch(url);
              if (res.ok) {
                data = await res.json();
                if (data && data.stops && Array.isArray(data.stops) && data.stops.length > 0) break;
              }
            } catch (e) {
              console.warn("NLB Stop fetch error:", url, e);
            }
          }

          if (!data || !data.stops || data.stops.length === 0) {
            container.innerHTML = `<div class="text-xs text-brand-gray p-4 text-center">未有嶼巴站表資料，請稍後重試</div>`;
            return;
          }

          container.innerHTML = data.stops.map((s, idx) => {
            const stopName = s.stopName_c || s.stopName_tc || s.stopName_e || '巴士站';
            const isAlreadyMonitored = monitoredBuses.some(b => 
              b.company === 'NLB' && 
              b.route.toUpperCase() === explorerRoute.route.toUpperCase() && 
              String(b.stopId) === String(s.stopId)
            );
            return `
              <div onclick="addStopToMonitoredBoard('${s.stopId}', '${stopName}')" class="p-3 rounded-2xl flex items-center justify-between cursor-pointer transition ${isAlreadyMonitored ? 'bg-teal-50 border border-teal-200' : 'bg-canvas hover:bg-gray-200/70'}">
                <div class="flex items-center space-x-3 text-xs">
                  <span class="opacity-60 font-bold">${s.stopSeq || idx + 1}.</span>
                  <span class="font-bold text-brand-dark">${stopName}</span>
                </div>
                <div class="flex items-center space-x-1.5">
                  ${isAlreadyMonitored ? `
                    <span class="text-[10px] bg-brand-nlb text-white font-extrabold px-2 py-0.5 rounded-full">已在看板</span>
                  ` : `
                    <span class="text-[10px] bg-brand-orange text-white font-extrabold px-2 py-0.5 rounded-full">＋ 加入</span>
                  `}
                </div>
              </div>
            `;
          }).join('');

        } else if (isMtr) {
          const lineCode = explorerRoute.line || 'TCL';
          const lineConfig = MTR_LINES[lineCode] || MTR_LINES.TCL;
          
          let stationList = [...lineConfig.stations];
          if (explorerRoute.direction === 'DOWN') {
            stationList.reverse();
          }

          container.innerHTML = stationList.map((staCode, idx) => {
            const staName = MTR_STATION_NAMES[staCode] || staCode;
            const isAlreadyMonitored = monitoredBuses.some(b => 
              b.company === 'MTR' && 
              b.line === lineCode && 
              b.stopId === staCode &&
              b.direction === explorerRoute.direction
            );

            return `
              <div onclick="addStopToMonitoredBoard('${staCode}', '${staName}')" class="p-3 rounded-2xl flex items-center justify-between cursor-pointer transition ${isAlreadyMonitored ? 'bg-amber-50 border border-amber-200' : 'bg-canvas hover:bg-gray-200/70'}">
                <div class="flex items-center space-x-3 text-xs">
                  <span class="opacity-60 font-bold">${idx + 1}.</span>
                  <span class="font-bold text-brand-dark">${staName}站</span>
                  <span class="text-[10px] text-brand-gray font-mono">(${staCode})</span>
                </div>
                <div class="flex items-center space-x-1.5">
                  ${isAlreadyMonitored ? `
                    <span class="text-[10px] bg-brand-mtr text-white font-extrabold px-2 py-0.5 rounded-full">已在看板</span>
                  ` : `
                    <span class="text-[10px] bg-brand-orange text-white font-extrabold px-2 py-0.5 rounded-full">＋ 加入</span>
                  `}
                </div>
              </div>
            `;
          }).join('');

        } else if (explorerRoute.company === 'CTB') {
          const ctbDir = explorerRoute.direction === 'outbound' ? 'outbound' : 'inbound';
          const url = `https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${explorerRoute.route}/${ctbDir}`;
          const res = await fetch(url);
          const data = await res.json();

          if (!data.data || data.data.length === 0) {
            container.innerHTML = `<div class="text-xs text-brand-gray p-4 text-center">未有城巴站表資料，請切換方向重試</div>`;
            return;
          }

          const stopsWithNames = await Promise.all(
            data.data.map(async (item) => {
              const stopName = await getCtbStopName(item.stop);
              return { ...item, stopName };
            })
          );

          container.innerHTML = stopsWithNames.map(item => {
            const isAlreadyMonitored = monitoredBuses.some(b => b.company === 'CTB' && b.route === explorerRoute.route && String(b.stopId) === String(item.stop));
            return `
              <div onclick="addStopToMonitoredBoard('${item.stop}', '${item.stopName}')" class="p-3 rounded-2xl flex items-center justify-between cursor-pointer transition ${isAlreadyMonitored ? 'bg-amber-50 border border-amber-200' : 'bg-canvas hover:bg-gray-200/70'}">
                <div class="flex items-center space-x-3 text-xs">
                  <span class="opacity-60 font-bold">${item.seq}.</span>
                  <span class="font-bold text-brand-dark">${item.stopName}</span>
                </div>
                <div class="flex items-center space-x-1.5">
                  ${isAlreadyMonitored ? `
                    <span class="text-[10px] bg-amber-500 text-white font-extrabold px-2 py-0.5 rounded-full">已在看板</span>
                  ` : `
                    <span class="text-[10px] bg-brand-orange text-white font-extrabold px-2 py-0.5 rounded-full">＋ 加入</span>
                  `}
                </div>
              </div>
            `;
          }).join('');

        } else {
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${explorerRoute.route}/${explorerRoute.direction}/${explorerRoute.serviceType || '1'}`;
          const res = await fetch(url);
          const data = await res.json();

          if (!data.data || data.data.length === 0) {
            container.innerHTML = `<div class="text-xs text-brand-gray p-4 text-center">未有站表資料，請嘗試切換方向</div>`;
            return;
          }

          const stopsWithNames = await Promise.all(
            data.data.map(async (item) => {
              const stopName = await getKmbStopName(item.stop);
              return { ...item, stopName };
            })
          );

          container.innerHTML = stopsWithNames.map(item => {
            const isAlreadyMonitored = monitoredBuses.some(b => b.company === 'KMB' && b.route === explorerRoute.route && String(b.stopId) === String(item.stop));
            return `
              <div onclick="addStopToMonitoredBoard('${item.stop}', '${item.stopName}')" class="p-3 rounded-2xl flex items-center justify-between cursor-pointer transition ${isAlreadyMonitored ? 'bg-red-50 border border-red-200' : 'bg-canvas hover:bg-gray-200/70'}">
                <div class="flex items-center space-x-3 text-xs">
                  <span class="opacity-60 font-bold">${item.seq}.</span>
                  <span class="font-bold text-brand-dark">${item.stopName}</span>
                </div>
                <div class="flex items-center space-x-1.5">
                  ${isAlreadyMonitored ? `
                    <span class="text-[10px] bg-brand-kmb text-white font-extrabold px-2 py-0.5 rounded-full">已在看板</span>
                  ` : `
                    <span class="text-[10px] bg-brand-orange text-white font-extrabold px-2 py-0.5 rounded-full">＋ 加入</span>
                  `}
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (e) {
        console.error("Render stops explorer error", e);
        container.innerHTML = `<div class="text-xs text-brand-gray p-4 text-center">讀取站表失敗，請稍後重試</div>`;
      }
    }

    async function reverseDirectionInModal() {
      if (explorerRoute.company === 'MTR') {
        const lineCode = explorerRoute.line || 'TCL';
        const lineConfig = MTR_LINES[lineCode] || MTR_LINES.TCL;
        if (explorerRoute.direction === 'UP') {
          explorerRoute.direction = 'DOWN';
          explorerRoute.dest = lineConfig.downDest;
        } else {
          explorerRoute.direction = 'UP';
          explorerRoute.dest = lineConfig.upDest;
        }
        renderStopsExplorerModal();
        return;
      }

      if (explorerRoute.company === 'NLB') {
        const routes = await fetchNlbRoutes();
        const matches = routes.filter(r => r.routeNo.toUpperCase() === explorerRoute.route.toUpperCase());
        if (matches.length > 1) {
          const other = matches.find(r => String(r.routeId) !== String(explorerRoute.routeId));
          if (other) {
            explorerRoute.routeId = other.routeId;
            if (other.routeName_c && other.routeName_c.includes('>')) {
              const parts = other.routeName_c.split('>');
              explorerRoute.dest = parts.length > 1 ? parts[1].trim() : parts[0].trim();
            } else {
              explorerRoute.dest = other.routeName_c || '大嶼山';
            }
            renderStopsExplorerModal();
            return;
          }
        }
        showToast("此嶼巴路線為單向或循環線。");
        return;
      }

      if (explorerRoute.company === 'CTB') {
        explorerRoute.direction = explorerRoute.direction === 'outbound' ? 'inbound' : 'outbound';
        renderStopsExplorerModal();
        return;
      }

      explorerRoute.direction = explorerRoute.direction === 'outbound' ? 'inbound' : 'outbound';
      renderStopsExplorerModal();
    }

    // Bookmarks List Inside Modal
    function renderBookmarksList() {
      const container = document.getElementById('bookmarksListContainer');
      if (bookmarks.length === 0) {
        container.innerHTML = `
          <div class="text-xs text-brand-gray p-6 text-center">
            未有收藏記錄，在看板卡片點擊 ⭐ 即可將常用路線加入收藏庫！
          </div>`;
        return;
      }

      let html = '';
      bookmarks.forEach((b, idx) => {
        const isMtr = b.company === 'MTR';
        const mtrLineInfo = isMtr ? (MTR_LINES[b.line] || MTR_LINES[b.route]) : null;
        const comp = COMPANY_CONFIG[b.company || 'KMB'] || COMPANY_CONFIG.KMB;
        const isMonitored = monitoredBuses.some(m => m.company === b.company && m.route === b.route && String(m.stopId) === String(b.stopId) && (!isMtr || m.direction === b.direction));

        const pillBg = mtrLineInfo ? mtrLineInfo.pillBg : comp.pillBg;
        const pillText = mtrLineInfo ? mtrLineInfo.pillText : comp.pillText;

            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] px-1.5 py-0.5 rounded ${pillBg} ${pillText} font-bold">${comp.name}</span>
                <span class="text-sm font-extrabold text-brand-dark">${b.route}</span>
              </div>
              <div class="text-xs text-brand-gray mt-0.5">${b.stopName} 往 ${b.dest}</div>
            </div>
            <div class="flex items-center space-x-1.5">
              <button onclick="addBookmarkToBoard(${idx})" class="text-xs font-bold px-2.5 py-1 rounded-xl transition ${isMonitored ? 'bg-gray-200 text-gray-600' : 'bg-brand-orange text-white active:scale-95'}">
                ${isMonitored ? '已在看板' : '＋ 加看板'}
              </button>
              <button onclick="removeBookmark(${idx})" class="text-xs text-gray-400 hover:text-red-500 p-2">✕</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function addBookmarkToBoard(idx) {
      const b = bookmarks[idx];
      const isMtr = b.company === 'MTR';
      const exists = monitoredBuses.some(m => m.company === b.company && m.route === b.route && String(m.stopId) === String(b.stopId) && (!isMtr || m.direction === b.direction));
      if (exists) {
        showToast("此路線已在看板中！");
        return;
      }

      monitoredBuses.push({
        id: `${b.company}-${b.line || b.route}-${b.stopId}-${b.direction}-${Date.now()}`,
        company: b.company || 'KMB',
        line: b.line || '',
        route: b.route,
        direction: b.direction || 'outbound',
        serviceType: b.serviceType || '1',
        stopId: b.stopId,
        stopName: b.stopName,
        dest: b.dest,
        routeId: b.routeId || ''
      });

      saveMonitoredBuses();
      showToast(`已將 ${b.route} 加入看板`);
      renderBookmarksList();
      refreshAllBusesETA();
    }

    function removeBookmark(idx) {
      const removed = bookmarks.splice(idx, 1);
      localStorage.setItem('hk_bookmarks_ultramin_v2', JSON.stringify(bookmarks));
      showToast(`已從收藏庫移除 ${removed[0]?.route || ''}`);
      renderBookmarksList();
      refreshAllBusesETA();
    }

    // Modal Control Functions
    function toggleBookmarksModal(show) {
      const modal = document.getElementById('bookmarksModal');
      if (show) {
        renderBookmarksList();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function toggleStopsModal(show) {
      const modal = document.getElementById('stopsModal');
      if (show) {
        renderStopsExplorerModal();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function toggleSearchModal(show) {
      const modal = document.getElementById('searchModal');
      if (show) {
        modal.classList.remove('hidden');
        document.getElementById('searchInput').focus();
      } else {
        modal.classList.add('hidden');
      }
    }

    function setSearchCompany(comp) {
      searchFilterCompany = comp;
      ['All', 'Nlb', 'Mtr', 'Kmb', 'Ctb'].forEach(c => {
        const btn = document.getElementById('filter' + c);
        if (!btn) return;
        if (c.toUpperCase() === comp) {
          btn.className = "flex-1 py-1.5 px-2 text-xs font-bold rounded-xl transition bg-white text-brand-dark shadow-sm shrink-0";
        } else {
          btn.className = "flex-1 py-1.5 px-2 text-xs font-bold rounded-xl transition text-brand-gray shrink-0";
        }
      });

      const mtrQuick = document.getElementById('mtrLinesQuickContainer');
      if (comp === 'MTR') {
        mtrQuick.classList.remove('hidden');
      } else {
        mtrQuick.classList.add('hidden');
      }

      handleSearchInput();
    }

    function selectMtrLine(lineCode) {
      const lineConfig = MTR_LINES[lineCode];
      if (!lineConfig) return;

      explorerRoute = {
        company: 'MTR',
        line: lineConfig.code,
        route: lineConfig.name,
        direction: 'UP',
        serviceType: '',
        routeId: '',
        dest: lineConfig.upDest
      };

      toggleSearchModal(false);
      toggleStopsModal(true);
    }

    function quickSearch(route, company) {
      document.getElementById('searchInput').value = route;
      setSearchCompany(company);
      selectDirectRoute(company, route);
    }

    function handleSearchInputDebounce() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(handleSearchInput, 150);
    }

    async function handleSearchInput() {
      const input = document.getElementById('searchInput').value.trim().toUpperCase();
      const container = document.getElementById('searchSuggestionsContainer');

      if (!input || input.length < 1) {
        container.classList.add('hidden');
        container.innerHTML = '';
        return;
      }

      let matches = [];

      if (searchFilterCompany === 'ALL' || searchFilterCompany === 'NLB') {
        const nlbRoutes = await fetchNlbRoutes();
        const nlbMatches = nlbRoutes.filter(r => r.routeNo.toUpperCase().startsWith(input) || r.routeNo.toUpperCase() === input);
        nlbMatches.slice(0, 5).forEach(r => {
          let dest = '大嶼山';
          if (r.routeName_c) {
            if (r.routeName_c.includes('>')) {
              const parts = r.routeName_c.split('>');
              dest = parts.length > 1 ? parts[1].trim() : parts[0].trim();
            } else {
              dest = r.routeName_c;
            }
          }
          matches.push({
            company: 'NLB',
            route: r.routeNo,
            routeId: r.routeId,
            dest: dest,
            label: `嶼巴 ${r.routeNo}`,
            subLabel: `往 ${dest}`,
            tagBg: 'bg-teal-50 text-teal-700'
          });
        });
      }

      if (searchFilterCompany === 'ALL' || searchFilterCompany === 'CTB') {
        const ctbRoutes = await fetchCtbRoutes();
        const ctbMatches = ctbRoutes.filter(r => r.route.toUpperCase().startsWith(input) || r.route.toUpperCase() === input);
        ctbMatches.slice(0, 5).forEach(r => {
          matches.push({
            company: 'CTB',
            route: r.route,
            routeId: '',
            dest: r.dest_tc || '終點站',
            label: `城巴 ${r.route}`,
            subLabel: `往 ${r.dest_tc || '終點站'}`,
            tagBg: 'bg-amber-50 text-amber-700'
          });
        });
      }

      if (searchFilterCompany === 'ALL' || searchFilterCompany === 'MTR') {
        for (const [code, l] of Object.entries(MTR_LINES)) {
          if (l.name.includes(input) || code.includes(input) || input.includes('港鐵') || input.includes('鐵路')) {
            matches.push({
              company: 'MTR',
              line: code,
              route: l.name,
              dest: l.upDest,
              label: `港鐵 ${l.name}`,
              subLabel: `${l.downDest} ⇄ ${l.upDest}`,
              tagBg: 'bg-red-50 text-[#A22030]'
            });
          }
        }
      }

      if (searchFilterCompany === 'ALL' || searchFilterCompany === 'KMB') {
        matches.push({
          company: 'KMB',
          route: input,
          dest: '終點站',
          label: `九巴/龍運 ${input}`,
          subLabel: `搜尋 ${input} 號線全綫站表`,
          tagBg: 'bg-red-50 text-red-600'
        });
      }

      if (matches.length > 0) {
        container.innerHTML = matches.map(m => `
          <div onclick="selectDirectRoute('${m.company}', '${m.route}', '${m.routeId || ''}', '${m.dest || ''}', '${m.line || ''}')" 
               class="p-2.5 bg-white rounded-xl flex items-center justify-between cursor-pointer hover:bg-orange-50 transition border border-gray-100 shadow-sm">
            <div class="flex items-center space-x-2">
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-lg ${m.tagBg}">${m.company}</span>
              <span class="text-xs font-extrabold text-brand-dark">${m.label}</span>
            </div>
            <span class="text-[11px] font-semibold text-brand-gray truncate max-w-[140px]">${m.subLabel}</span>
          </div>
        `).join('');
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    function selectDirectRoute(company, route, routeId = '', dest = '', line = '') {
      if (company === 'MTR') {
        selectMtrLine(line || 'TCL');
        return;
      }

      explorerRoute = {
        company: company,
        line: line || '',
        route: route,
        direction: 'outbound',
        serviceType: '1',
        routeId: routeId || '',
        dest: dest || '終點站'
      };

      toggleSearchModal(false);
      toggleStopsModal(true);
    }

    async function handleSearchRouteSubmit() {
      const input = document.getElementById('searchInput').value.trim().toUpperCase();
      if (!input) return;

      for (const [code, l] of Object.entries(MTR_LINES)) {
        if (input === code || input === l.name || input.includes(l.name) || l.name.includes(input)) {
          selectMtrLine(code);
          return;
        }
      }

      for (const [code, sName] of Object.entries(MTR_STATION_NAMES)) {
        if (input === sName || input === `${sName}站` || input === code) {
          for (const [lCode, l] of Object.entries(MTR_LINES)) {
            if (l.stations.includes(code)) {
              selectMtrLine(lCode);
              return;
            }
          }
        }
      }

      const nlbRoutes = await fetchNlbRoutes();
      const nlbMatch = nlbRoutes.find(r => r.routeNo.toUpperCase() === input);

      if (searchFilterCompany === 'NLB' || (searchFilterCompany === 'ALL' && nlbMatch)) {
        let dest = '大嶼山';
        if (nlbMatch && nlbMatch.routeName_c) {
          if (nlbMatch.routeName_c.includes('>')) {
            const parts = nlbMatch.routeName_c.split('>');
            dest = parts.length > 1 ? parts[1].trim() : parts[0].trim();
          } else {
            dest = nlbMatch.routeName_c;
          }
        }

        explorerRoute = {
          company: 'NLB',
          line: '',
          route: input,
          direction: 'outbound',
          serviceType: '1',
          routeId: nlbMatch ? nlbMatch.routeId : '',
          dest: dest
        };
      } else if (searchFilterCompany === 'CTB') {
        explorerRoute = {
          company: 'CTB',
          line: '',
          route: input,
          direction: 'outbound',
          serviceType: '1',
          routeId: '',
          dest: '終點站'
        };
      } else {
        explorerRoute = {
          company: 'KMB',
          line: '',
          route: input,
          direction: 'outbound',
          serviceType: '1',
          routeId: '',
          dest: '終點站'
        };
      }

      toggleSearchModal(false);
      toggleStopsModal(true);
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = "fixed top-14 left-1/2 -translate-x-1/2 bg-brand-dark/95 backdrop-blur text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl z-50 transition-all border border-white/10";
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }
  </script>
</body>
</html>
